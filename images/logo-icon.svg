<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="clayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2593F"/>
      <stop offset="50%" stop-color="#B84A39"/>
      <stop offset="100%" stop-color="#8C2C1D"/>
    </linearGradient>
    <linearGradient id="ochreGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BA7325"/>
      <stop offset="100%" stop-color="#E5A84B"/>
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D2421"/>
      <stop offset="100%" stop-color="#1C1917"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1C1917" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Circle (Warm Linen) -->
  <circle cx="100" cy="100" r="92" fill="#FAF8F5" stroke="#EAE1D3" stroke-width="2.5"/>

  <!-- Rotating Perbot Miring Tilted Arc (35 Degree Axis) -->
  <g transform="rotate(-35 100 100)">
    <!-- Elliptical Tilted Wheel Base -->
    <ellipse cx="100" cy="155" rx="58" ry="14" fill="none" stroke="url(#ochreGrad)" stroke-width="3" stroke-dasharray="6 4"/>
    <!-- Wheel Axis Indicator Line -->
    <line x1="100" y1="40" x2="100" y2="165" stroke="#EAE1D3" stroke-width="1.5" stroke-dasharray="3 3"/>
  </g>

  <!-- Stylized Pottery Emblem: Kendi Maling & Craft Sprout -->
  <g filter="url(#subtleShadow)">
    <!-- Base Pedestal -->
    <path d="M 82 148 C 82 144, 90 142, 100 142 C 110 142, 118 144, 118 148 C 118 151, 110 153, 100 153 C 90 153, 82 151, 82 148 Z" fill="#8C2C1D"/>
    
    <!-- Kendi Main Belly & Silhouette -->
    <path d="M 100 68 
             C 107 68, 111 75, 111 84 
             C 111 90, 115 95, 122 102
             C 133 113, 136 126, 128 138 
             C 122 146, 112 148, 100 148 
             C 88 148, 78 146, 72 138 
             C 64 126, 67 113, 78 102
             C 85 95, 89 90, 89 84
             C 89 75, 93 68, 100 68 Z" 
          fill="url(#clayGrad)"/>

    <!-- Kendi Crown / Neck Rim -->
    <path d="M 94 62 C 94 60, 97 58, 100 58 C 103 58, 106 60, 106 62 L 106 68 L 94 68 Z" fill="#BA7325"/>
    <ellipse cx="100" cy="58" rx="7" ry="2.5" fill="#E5A84B"/>

    <!-- Iconic Kendi Curved Spout (Corot Kendi) -->
    <path d="M 76 110 C 65 106, 56 94, 60 82 C 61 79, 64 80, 64 83 C 62 91, 69 100, 77 103 Z" fill="url(#clayGrad)"/>

    <!-- Subtle Ceramic Reflection / Light Highlight -->
    <path d="M 112 105 C 120 114, 121 124, 116 133 C 114 136, 111 138, 108 140 C 114 136, 118 128, 117 120 C 116 112, 110 106, 106 102 Z" fill="#FAF8F5" opacity="0.3"/>

    <!-- Golden Spark of Heritage (Sunan Pandanaran Star / Sun) -->
    <circle cx="138" cy="62" r="4.5" fill="url(#ochreGrad)"/>
    <path d="M 138 53 L 138 71 M 129 62 L 147 62" stroke="#E5A84B" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Lower Ribbon Arch with WBTb SK Text -->
  <path id="textArc" d="M 40 145 A 72 72 0 0 0 160 145" fill="none"/>
  <text font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.18em" fill="#8C2C1D">
    <textPath href="#textArc" startOffset="50%" text-anchor="middle">
      WARISAN TANAH LIAT • KLATEN
    </textPath>
  </text>
</svg>

